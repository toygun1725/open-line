<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13181d"><title>Açık Hat · Open Line</title>
<style>
/*__PREVIEW_FONTS_CSS__*/
* {
  box-sizing: border-box;
}
:root {
  font:
    16px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #f7f4ed;
  background: #12161a;
  color-scheme: dark;
}
body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 12px;
  background: radial-gradient(ellipse at 50% 42%, #30343a, #13171b 66%);
}
button,
select {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button {
  border: 0;
  background: none;
}
button:focus-visible,
summary:focus-visible,
select:focus-visible {
  outline: 3px solid #e8aa6a;
  outline-offset: 2px;
}
button:disabled {
  cursor: default;
}
.phone {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  width: min(392px, 100vw);
  height: min(790px, calc(100svh - 102px));
  min-height: 470px;
  overflow: hidden;
  border: 5px solid #414347;
  border-radius: 49px;
  background: #172129;
  box-shadow:
    0 0 0 2px #0c0d0e,
    0 16px 52px #08090ac2;
}
.phone:before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #07131be6, #0a18297d 25%, transparent 55%, #071219df 100%);
}
.phone.chat:before {
  background: linear-gradient(180deg, var(--deck), var(--paper) 38%);
}
.phone:after {
  content: "";
  height: 4px;
  width: 100px;
  border-radius: 2px;
  background: currentColor;
  opacity: 0.64;
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}
.screen {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: auto;
}
.island {
  width: 76px;
  height: 20px;
  background: #090b0d;
  border-radius: 18px;
  align-self: center;
  flex: none;
  margin: 10px auto 2px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 5px 22px 0;
  border-bottom: 1px solid #ffffff37;
  min-height: 44px;
}
.wordmark {
  font:
    500 19px Georgia,
    serif;
  letter-spacing: 0.015em;
}
.gear {
  width: 44px;
  height: 44px;
  font-size: 22px;
  color: inherit;
}
.clockarea {
  padding: 19px 16px 26px;
  text-align: center;
  text-shadow: 0 2px 20px #0008;
}
.date {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .08em;
}
.clock {
  font-size: clamp(68px, 11vh, 94px);
  line-height: 1.06;
  font-weight: 300;
  letter-spacing: -0.055em;
  font-variant-numeric: tabular-nums;
}
.inbox {
  margin: auto 16px 27px;
  display: grid;
  gap: 8px;
}
.card {
  border: 1px solid #f3e9d32b;
  border-radius: 15px;
  background: linear-gradient(135deg, #233039f5, #101b25ef);
  backdrop-filter: blur(18px);
  box-shadow: 0 7px 22px #06111a58, inset 0 1px #fff1;
  overflow: hidden;
}
.row {
  width: 100%;
  min-height: 76px;
  display: flex;
  align-items: flex-start;
  text-align: left;
  gap: 12px;
  padding: 13px;
}
.row:focus-visible { outline-offset: -4px; }
.row:hover, .row:active { background: #fff1; }
.row-tail { display: grid; justify-items: end; gap: 7px; padding-top: 1px; color: #e7dad0; }
.row-tail time { font: 12px ui-monospace, monospace; }
.row-chevron { font-size: 19px; line-height: 1; }
.line-lock {
  position: relative;
  width: .72em;
  height: .57em;
  margin: 8px 2px 0;
  border: 1px solid currentColor;
  border-radius: 2px;
}
.line-lock::before {
  content: "";
  position: absolute;
  top: -.33em;
  left: 1px;
  right: 1px;
  height: .32em;
  border: 1px solid currentColor;
  border-radius: 5px 5px 0 0;
}
.avatar {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #974e59, #5b303e);
  box-shadow: inset 0 0 0 1px #ffffff31;
  color: #ffe6d9;
  font:
    italic 23px Georgia,
    serif;
}
.ice .avatar {
  background: linear-gradient(145deg, #3e7290, #26465e);
  color: #daeef8;
}
.msg {
  flex: 1;
  min-width: 0;
}
.by {
  font-size: .975rem;
  font-weight: 650;
}
.storytitle {
  display: block;
  color: #e1c5b0;
  font-size: .75rem;
  font-weight: 500;
}
.ice .storytitle { color: #b8dafa; }
.snippet {
  color: #ebe9e4;
  margin-top: 3px;
  font-size: .875rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.row[aria-expanded="true"] .snippet {
  -webkit-line-clamp: unset;
}
.detail {
  border-top: 1px solid #ffffff24;
  margin: 0 15px;
  padding: 11px 0 14px;
}
.detail p {
  margin: 0 0 12px;
  font-size: 14px;
}
.action,
.alt {
  padding: 10px 14px;
  min-height: 44px;
  border-radius: 12px;
  font-weight: 600;
}
.action {
  background: #efd6c3;
  color: #291e1a;
}
.alt {
  color: inherit;
  border: 1px solid currentColor;
}
.detail .action,
.panel .action {
  width: 100%;
}
.ice .detail .action {
  background: #d2e2ed;
}
.chat {
  --deck: #38202f;
  --paper: #f1e2e0;
  --message: #fff7f1;
  --rule: #ccb1b5;
  --accent: #8b3850;
  --lit: #e5a4ab;
  --quiet: #663f4b;
  background: var(--paper);
  color: #341e29;
  color-scheme: light;
}
.chat.icechat {
  --deck: #162b3d;
  --paper: #dfeaf0;
  --message: #f6fbfd;
  --rule: #a3bece;
  --accent: #285876;
  --lit: #9bcbe7;
  --quiet: #3e586b;
  color: #193144;
}
.chat .island {
  background: #1e2227;
}
.chathead {
  flex: none;
  margin: 4px 12px 0;
  padding: 2px 8px 10px;
  border: 1px solid #fff3;
  border-radius: 15px 15px 5px 5px;
  background: color-mix(in srgb, var(--deck), white 6%);
  color: #fff8f4;
  box-shadow: 0 6px 16px #0e121c34;
}
.chatnav {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px;
  align-items: center;
  gap: 4px;
}
.chatnav h1 {
  margin: 0;
  text-align: center;
  font: 500 1.3rem/1.15 Georgia, serif;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.chatnav button {
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  background: radial-gradient(circle, #fff1 15px, transparent 16px);
}
.chatnav button:hover, .chatnav button:active { background: #fff2; }
.chatnav .navback {
  font-size: 28px;
  line-height: 1;
  padding-bottom: 3px;
}
.chatmeta,
.chatmetrics {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px 10px;
}
.chatmeta {
  border-top: 1px solid #ffffff2e;
  padding: 8px 5px 0;
  font-size: .8125rem;
  font-weight: 600;
}
.chatprogress {
  flex: 1 1 64px;
  display: flex;
  gap: 4px;
  min-width: 64px;
}
.chatprogress i {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: #ffffff32;
}
.chatprogress .filled { background: var(--lit); }
.chatprogress.critical .filled { background: #ff8d89; }
.chatstatus {
  color: var(--lit);
  border-radius: 999px;
  padding: 2px 9px;
  border: 1px solid #ffffff37;
}
.chatstatus.urgent { color: #ffc1ba; }
.chatstatus,
.chattimer { white-space: nowrap; }
.chattimer {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  font-variant-numeric: tabular-nums;
}
.timer-icon {
  position: relative;
  width: 12px;
  height: 12px;
  border: 1px solid currentColor;
  border-radius: 50%;
}
.timer-icon::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 2px;
  width: 1px;
  height: 4px;
  background: currentColor;
}
.feed {
  flex: 1;
  overflow: auto;
  margin: 0 12px;
  padding: 13px 12px 27px;
  background: var(--paper);
  border-radius: 5px 5px 0 0;
  scrollbar-color: var(--rule) transparent;
}
.bubble,
.panel {
  background: var(--message);
  border: 1px solid var(--rule);
  padding: 11px 13px;
  margin: 4px 0;
}
.bubble {
  margin-right: 9%;
  border-radius: 5px 14px 14px 5px;
  font-family: var(--message-family);
  font-size: 1rem;
  line-height: 1.52;
  box-shadow: 0 2px 3px #24202a0c;
}
.bubble.first-in-group { border-top-left-radius: 14px; }
.sender-label {
  margin: 13px 0 5px 2px;
  color: var(--accent);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .035em;
}
.sender-label:first-child { margin-top: 2px; }
.panel { border-radius: 12px; }
.panel .action { background: var(--accent); color: #fff8f4; }
.tele {
  font:
    .75rem/1.45 ui-monospace,
    monospace;
  color: var(--quiet);
  text-align: center;
  padding: 8px 3px;
  margin-top: 9px;
  border-top: 1px solid var(--rule);
}
.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.choices button {
  position: relative;
  min-width: 0;
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 9px 10px 9px 23px;
  min-height: 48px;
  font: var(--reply-weight) .9375rem/1.4 var(--reply-family);
  overflow-wrap: anywhere;
  background: var(--message);
  text-align: left;
}
.choices button::before {
  content: "";
  position: absolute;
  top: 14px;
  left: 9px;
  width: 7px;
  height: 7px;
  border: 1px solid currentColor;
  border-radius: 2px;
}
@media (max-width: 280px) {
  .choices { grid-template-columns: minmax(0, 1fr); }
}
.choices button:enabled:hover { background: var(--paper); }
.phone {
  --message-family: Georgia, serif;
  --reply-family: ui-serif, Georgia, serif;
  --reply-weight: 600;
}
.phone[data-reply-font="sans"] {
  --reply-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --reply-weight: 500;
}
.phone[data-reply-font="mono"] {
  --reply-family: ui-monospace, monospace;
  --reply-weight: 500;
}
.reply-sample {
  font: var(--reply-weight) 15px/1.4 var(--reply-family);
  margin: 0 0 12px;
}
.message-sample { font: 400 1rem/1.4 var(--message-family); }
.typing {
  display: flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  margin: 8px 0;
  padding: 7px 11px;
  border-radius: 14px;
  background: #f9f3ef;
  color: #51444a;
  font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.icechat .typing { background: #edf4f8; color: #384f61; }
.typing-dots { display: flex; gap: 3px; }
.typing-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) {
  .typing-dots i { animation: openline-dot 1.2s ease-in-out infinite; }
  .typing-dots i:nth-child(2) { animation-delay: 0.14s; }
  .typing-dots i:nth-child(3) { animation-delay: 0.28s; }
  .bubble.arriving { animation: openline-arrival 220ms ease-out; }
  .choices button:enabled:active { transform: translateY(2px); }
}
@keyframes openline-dot {
  0%, 60%, 100% { opacity: .45; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}
@keyframes openline-arrival {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.choices .selected {
  background: var(--accent);
  color: white;
}
.choices .selected::before { background: currentColor; }
.choices button:disabled:not(.selected) {
  color: var(--quiet);
  background: transparent;
  border-color: var(--rule);
}
.panel p {
  font-size: 14px;
}
.panel .alt {
  margin-top: 8px;
  width: 100%;
}
.overlay {
  position: absolute;
  z-index: 2;
  inset: 0;
  background: #06090d9c;
  display: flex;
  align-items: flex-end;
}
.sheet {
  width: 100%;
  max-height: calc(100% - 20px);
  overflow: auto;
  border-radius: 24px 24px 0 0;
  padding: 23px 18px 25px;
  border: 1px solid #ffffff40;
  background: #16252ef7;
  color: white;
  color-scheme: dark;
  display: grid;
  gap: 11px;
}
.sheet h2,
.sheet p,
.panel h3 {
  margin: 0;
}
.sheet p {
  color: #d3d5d6;
}
.sheet h2 { font: 500 1.7rem/1.2 Georgia, serif; }
.preferences .alt { border-color: #91a1a9; }
.setting-list { border-top: 1px solid #fff3; border-bottom: 1px solid #fff3; }
.setting-list label, .sound-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 3px 7px;
  width: 100%;
  padding: 3px 0;
  min-height: 47px;
  font-size: .9rem;
}
.setting-list label + label { border-top: 1px solid #fff2; }
.setting-list select {
  background: #263741;
  border: 1px solid #52616b;
  border-radius: 6px;
  max-width: 100%;
  min-height: 44px;
  padding: 4px 7px;
}
.setting-list .reply-sample {
  margin: 3px 0 10px;
  padding: 9px 11px;
  border-radius: 10px 4px 10px 10px;
  color: #fdf4ee;
  background: #33434d;
}
.sound-toggle { border-top: 1px solid #fff2; text-align: left; }
.sound-toggle i {
  width: 36px;
  height: 20px;
  padding: 3px;
  border: 1px solid #9caeb8;
  border-radius: 12px;
}
.sound-toggle i::before { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #f7eee4; }
.sound-toggle[aria-checked="true"] i { background: #426777; }
.sound-toggle[aria-checked="true"] i::before { margin-left: auto; }
.access-link { min-height: 44px; color: #f0c19f; text-align: left; padding: 0; }
.tools {
  width: min(370px, 95vw);
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  color: #b8bdc5;
  font-size: 12px;
}
.tools select {
  background: #22292e;
  border: 1px solid #46515a;
  border-radius: 7px;
  padding: 6px;
  max-width: 73%;
}
.notice {
  font-size: 12px;
}
.phone.mono { --message-family: ui-monospace, monospace; }
.phone.sans { --message-family: system-ui, sans-serif; }
.sysbtn {
  width: 100%;
  display: grid;
  text-align: left;
  gap: 4px;
  padding: 10px 14px;
  font-size: 13px;
}
.stages {
  display: flex;
  gap: 4px;
}
.stages span {
  flex: 1;
  border-top: 3px solid #686d72;
  padding-top: 4px;
  font-size: 10px;
}
.stages span.filled {
  border-color: #f1c2a3;
}
@media (max-width: 520px) {
  body {
    gap: 4px;
    background: #14191c;
  }
  .phone {
    width: 100vw;
    height: calc(100svh - 108px);
    border: 0;
    border-radius: 0;
    min-height: 320px;
  }
  .phone.chat {
    height: calc(100svh - 42px);
  }
  .tools {
    height: 38px;
  }
  .island {
    margin-top: 8px;
  }
}
@media (max-height: 630px) {
  .clockarea {
    padding: 4px 0 12px;
  }
  .clock {
    font-size: 54px;
  }
  .phone {
    min-height: 300px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
