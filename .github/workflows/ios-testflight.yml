name: iOS TestFlight CI

on:
  push:
    branches: [ main ]
    paths:
      - 'OpenLine/**'
      - 'OpenLineWidgets/**'
      - 'OpenLineTests/**'
      - 'Shared/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

jobs:
  validate-test-and-upload:
    name: Validate Story, Test & Upload TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate story graph & localization
        run: |
          python3 scripts/validate_story.py
          node --test scripts/test_story_routes.cjs

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Select Xcode for App Store Connect
        run: |
          if [[ "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -lt 26 ]]; then
            for xcode in /Applications/Xcode_*.app; do
              version=${xcode#/Applications/Xcode_}
              if [[ "${version%%.*}" =~ ^[0-9]+$ && "${version%%.*}" -ge 26 ]]; then
                sudo xcode-select --switch "$xcode/Contents/Developer"
                break
              fi
            done
          fi
          xcodebuild -version
          [[ "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26 ]]

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iOS Simulator
        run: |
          DEST=$(xcrun simctl list devices available | sed -nE 's/^ *iPhone [^()]* \(([A-F0-9-]+)\).*/platform=iOS Simulator,id=\1/p' | head -n 1)
          : "${DEST:?No available iPhone simulator}"
          echo "Using simulator destination: $DEST"
          xcodebuild test \
            -project OpenLine.xcodeproj \
            -scheme OpenLine \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Apple Distribution certificate and profiles
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          APP_PROFILE: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_STORE_PROFILE_BASE64 }}
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64$ASC_KEY_P8_BASE64$APP_PROFILE$WIDGET_PROFILE" && "${{ github.event_name }}" != workflow_dispatch ]]; then
            exit 0
          fi
          for setting in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID APP_BUNDLE_ID APP_PROFILE WIDGET_PROFILE; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing signing setting $setting"
              exit 1
            fi
          done
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/dist.p12
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          P8_PATH="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$P8_PATH"
          chmod 600 "$P8_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          install_profile() {
            local encoded=$1 expected_bundle=$2 profile_name=$3
            local profile="$RUNNER_TEMP/$profile_name.mobileprovision"
            local plist="$RUNNER_TEMP/$profile_name.plist"
            printf '%s' "$encoded" | base64 --decode -o "$profile"
            security cms -D -i "$profile" -o "$plist"
            local app_id uuid
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
            [[ "$app_id" == "$APPLE_TEAM_ID.$expected_bundle" ]]
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            cp "$profile" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "$profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")" >> "$GITHUB_OUTPUT"
          }
          install_profile "$APP_PROFILE" "$APP_BUNDLE_ID" app_profile
          install_profile "$WIDGET_PROFILE" "$APP_BUNDLE_ID.LiveActivity" widget_profile

      - name: Archive & Upload to TestFlight
        if: steps.signing.outputs.app_profile != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          APP_PROFILE_NAME: ${{ steps.signing.outputs.app_profile }}
          WIDGET_PROFILE_NAME: ${{ steps.signing.outputs.widget_profile }}
        run: |
          P8_PATH="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$APP_PROFILE_NAME</string>
              <key>$APP_BUNDLE_ID.LiveActivity</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project OpenLine.xcodeproj \
            -scheme OpenLine \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/OpenLine.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OPENLINE_APP_PROFILE="$APP_PROFILE_NAME" \
            OPENLINE_WIDGET_PROFILE="$WIDGET_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=YES

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenLine.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cleanup signing secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$RUNNER_TEMP/app_profile.mobileprovision" "$RUNNER_TEMP/app_profile.plist" "$RUNNER_TEMP/widget_profile.mobileprovision" "$RUNNER_TEMP/widget_profile.plist"
