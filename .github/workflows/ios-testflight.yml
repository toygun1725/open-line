name: iOS TestFlight CI

on:
  push:
    branches: [ main ]
    paths:
      - 'OpenLine/**'
      - 'OpenLineWidgets/**'
      - 'OpenLineTests/**'
      - 'Shared/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

jobs:
  validate-test-and-upload:
    name: Validate Story, Test & Upload TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate story graph & localization
        run: |
          python3 scripts/validate_story.py
          node --test scripts/test_story_routes.cjs

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iOS Simulator
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -E "iPhone (16|15)" | sed -E 's/.*\(([A-F0-9-]+)\).*/platform=iOS Simulator,id=\1/' || echo "platform=iOS Simulator,name=iPhone 16")
          echo "Using simulator destination: $DEST"
          xcodebuild test \
            -project OpenLine.xcodeproj \
            -scheme OpenLine \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Setup keychain & App Store Connect API Key
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          HAS_ASC_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.APP_BUNDLE_ID != '' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/dist.p12
          mkdir -p $RUNNER_TEMP/private_keys
          P8_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$P8_PATH"
          chmod 600 "$P8_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive & Upload to TestFlight
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          HAS_ASC_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.APP_BUNDLE_ID != '' }}
        run: |
          P8_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project OpenLine.xcodeproj \
            -scheme OpenLine \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OpenLine.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            APP_BUNDLE_ID="${{ secrets.APP_BUNDLE_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$P8_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/OpenLine.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$P8_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Cleanup signing secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/ExportOptions.plist"
